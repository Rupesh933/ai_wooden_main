{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}TimberNest Dashboard{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom Dashboard CSS -->
    <link
      rel="stylesheet"
      href="{% static 'css/support_dashboard_admin.css' %}"
    />

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <aside class="tn-sidebar d-flex flex-column flex-shrink-0 p-3 text-white">
        <a
          href="{% url 'dashboard' %}"
          class="text-white text-decoration-none fs-6 fw-bold mb-3"
        >
          🪵 TimberNest Furniture
        </a>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a
              href="{% url 'dashboard' %}"
              class="nav-link active text-white"
            >
              💬 Conversations
            </a>
          </li>
        </ul>
        <hr />
        <span style="font-size: 11px; opacity: 0.5"> Logged in as admin </span>
      </aside>

      <!-- Main Content -->
      <main class="flex-grow-1 min-vh-100">
        {% block content %} {% endblock %}
      </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
