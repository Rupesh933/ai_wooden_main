<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — TimberNest Furniture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #f5efe6;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(76,52,32,0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand h4 {
      font-weight: 700;
      color: #3e2c1c;
      margin: 0;
    }

    .brand p {
      color: #8a7461;
      font-size: 13px;
      margin: 4px 0 0;
    }

    .form-label {
      font-size: 13px;
      color: #5c4630;
      font-weight: 500;
    }

    .form-control {
      border-radius: 8px;
      border: 1px solid #e2d5c3;
      padding: 10px 14px;
      font-size: 14px;
    }

    .form-control:focus {
      border-color: #a9713f;
      box-shadow: 0 0 0 3px rgba(169,113,63,0.15);
    }

    .btn-login {
      background: #6b3f1d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      margin-top: 8px;
    }

    .btn-login:hover {
      background: #8a5227;
      color: #fff;
    }

    .demo-hint {
      background: #f8f3ec;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #8a7461;
      margin-top: 20px;
      text-align: center;
    }

    .demo-hint strong {
      color: #5c4630;
    }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #f8d7da;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #842029;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="login-card">

  <div class="brand">
    <h4>🪵 TimberNest</h4>
    <p>Handcrafted Wooden Furniture</p>
  </div>

  {% if form.errors %}
  <div class="error-msg">
    Invalid username or password. Please try again.
  </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input
        type="text"
        name="username"
        class="form-control"
        placeholder="Enter your username"
        autofocus
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Enter your password"
      />
    </div>

    <button type="submit" class="btn-login">
      Sign In
    </button>

  </form>

  <div class="demo-hint">
    Demo credentials &nbsp;·&nbsp;
    username: <strong>arvind</strong> &nbsp;·&nbsp;
    password: <strong>demo1234</strong>
  </div>

</div>

</body>
</html>
